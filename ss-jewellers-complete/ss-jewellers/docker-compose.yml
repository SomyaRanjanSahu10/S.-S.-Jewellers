version: '3.9'

services:

  # ── MongoDB ──────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: ss_jewellers_mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ssjewellers
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.runCommand({ ping: 1 })']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ss_jewellers_api
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/ssjewellers
      JWT_SECRET: dev_jwt_secret_change_in_production
      JWT_REFRESH_SECRET: dev_refresh_secret_change_in_production
      JWT_EXPIRES_IN: 15m
      FRONTEND_URL: http://localhost:3000
      # Add your API keys below for local dev
      # RAZORPAY_KEY_ID: rzp_test_xxx
      # RAZORPAY_KEY_SECRET: xxx
      # CLOUDINARY_CLOUD_NAME: xxx
      # CLOUDINARY_API_KEY: xxx
      # CLOUDINARY_API_SECRET: xxx
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - /app/node_modules
    command: npm run dev

  # ── Frontend ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ss_jewellers_frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
      NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_xxx
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: your_cloud_name
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  mongo_data:
    driver: local
